<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SAIPA</title>
    <link rel="icon" href="/_folio/static/saipa-icon.svg" type="image/svg+xml" />
    <script>
      // Match Immich's light/dark setting (stored by Immich under "color-theme" on this same origin).
      (() => {
        let dark = matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          const raw = localStorage.getItem('color-theme');
          if (raw) {
            const value = raw.startsWith('{') ? JSON.parse(raw) : { value: raw.replace(/"/g, '') };
            if (value.system !== true) dark = value.value === 'dark' ? true : value.value === 'light' ? false : dark;
          }
        } catch {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="/_folio/static/editor.css?v=__VERSION__" />
    <link rel="stylesheet" href="/_folio/static/saipa.css?v=__VERSION__" />
  </head>
  <body class="saipa">
    <div id="app" aria-live="polite"></div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/_folio/static/saipa.js?v=__VERSION__"></script>
  </body>
</html>
