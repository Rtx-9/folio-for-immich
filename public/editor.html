<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pages · Folio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234250af'/%3E%3Cpath d='M6 7h12v2H6zm0 4h8v6H6zm10 0h2v2h-2zm0 4h2v2h-2z' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      // Match Immich's light/dark setting (stored by Immich under "color-theme" on this same origin).
      (() => {
        let dark = matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          const raw = localStorage.getItem('color-theme');
          if (raw) {
            const value = raw.startsWith('{') ? JSON.parse(raw) : { value: raw.replace(/"/g, '') };
            if (value.system !== true) dark = value.value === 'dark' ? true : value.value === 'light' ? false : dark;
          }
        } catch {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="/_folio/static/editor.css" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/_folio/static/editor.js"></script>
  </body>
</html>
